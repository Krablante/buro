id: project
label: Project
fields:
  summary: {type: text, guide: "What this object is, why it exists, and what it does."}
  important: {type: string-list, guide: "Confirmed facts, decisions, and requirements. Approval conditions belong here, even when phrased as prohibitions."}
  avoid: {type: string-list, guide: Other prohibitions and operating restrictions. Do not duplicate approval conditions from important.}
  locations:
    type: record-list
    guide: Source, runtime, data, materials, or web pages. Paths belong to their recorded devices.
    fields:
      host: {type: string, guide: Device name; a host record is optional.}
      path: {type: string, guide: Absolute path on that device.}
      url: {type: string, guide: Network address.}
      purpose: {type: text, guide: What is located here.}
  related:
    type: record-list
    guide: Informational references. Choose one of id, path, or url; note explains the link. They do not block deletion.
    fields:
      id: {type: string, guide: Exact BURO record ID.}
      path: {type: string, guide: File or directory.}
      url: {type: string, guide: Web resource.}
      note: {type: text, guide: Why this reference matters.}
  read_first: {type: string-list, guide: Main documents and instructions to read when needed for the task.}
  aliases: {type: string-list, guide: Other names used to find this object.}
  notes: {type: text, guide: Durable details that do not fit the short summary. Exclude session logs and temporary plans.}
  repo: {type: string, guide: "Repository URL for code, materials, or configuration, when present."}
