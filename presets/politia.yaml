id: politia
version: 6
default_kind: project
context:
  kind: host
  alias_field: lan_names
  member_field: locations
  root_field: politia_root
field_sets:
  entity: [aliases, category, locations, repo, upstream_repo, git, summary, read_first, important, avoid, related, use_skills, notes]
  host: [role, description, availability, lan_ipv4, lan_names, politia_user, politia_root, state_root, ssh_target, capabilities, git_identities, git_enforcement, politia_geometry, enabled, avoid]
kinds:
  project: {field_sets: [entity]}
  service: {field_sets: [entity]}
  lab: {field_sets: [entity]}
  host: {field_sets: [host]}
fields:
  aliases: {type: string-list, section: identity, guide: alternate names used in conversation}
  category: {type: string, section: identity, guide: free-form grouping independent of filesystem directories}
  locations:
    type: record-list
    section: location
    guide: verified locations; every path belongs to its recorded host
    fields:
      host: {type: string}
      path: {type: string}
      url: {type: string}
      purpose: {type: text}
  repo: {type: string, section: repository, guide: primary repository URL}
  upstream_repo: {type: string, section: repository, guide: upstream repository for forks or derivatives}
  git:
    type: record
    section: repository
    guide: applicable Git identity and GitHub CLI context
    fields:
      user_name: {type: string}
      user_email: {type: string}
      gh_cli_user: {type: string}
      instructions: {type: text}
    paired_fields: [[user_name, user_email]]
  summary: {type: text, section: summary, guide: short verified description}
  read_first: {type: string-list, section: read_first, guide: canonical entry documents; read only what the task needs}
  important: {type: string-list, section: important, guide: confirmed facts and decisions that affect work}
  avoid: {type: string-list, section: avoid, guide: concrete restrictions and unsafe assumptions}
  related:
    type: record-list
    section: related
    guide: useful entities or resources with an explanation
    fields:
      path: {type: string, required: true}
      note: {type: text}
  use_skills:
    type: record-list
    section: use_skills
    guide: relevant skills and when to use them
    fields:
      id: {type: string, required: true}
      note: {type: text}
  notes: {type: text, section: notes, guide: other durable facts; exclude session logs and speculation}
  role: {type: string, section: host, guide: operational role of the host}
  description: {type: text, section: host, guide: short verified description of the host}
  availability: {type: string, section: host, guide: expected availability of the host}
  lan_ipv4: {type: string, section: host, guide: primary IPv4 address on the local network}
  lan_names: {type: string-list, section: host, guide: hostnames and aliases used on the local network}
  politia_user: {type: string, section: host, guide: operating-system user that owns Politia}
  politia_root: {type: string, section: host, guide: absolute path to the Politia workspace root}
  state_root: {type: string, section: host, guide: absolute path for mutable Politia runtime state}
  ssh_target: {type: string, section: host, guide: SSH target used to reach the host}
  capabilities: {type: string-list, section: host, guide: tools and services available on the host}
  git_identities:
    type: record-list
    section: host
    guide: Git identities and CLI contexts available on the host
    fields:
      user_name: {type: string, required: true}
      user_email: {type: string, required: true}
      gh_cli_user: {type: string}
      instructions: {type: text}
  git_enforcement:
    type: record
    section: host
    guide: Git identity enforcement applied on the host
    fields:
      guard_profile: {type: string}
      hooks_path: {type: string}
  politia_geometry: {type: string-list, section: host, guide: existing folder conventions; no convention is required by BURO}
  enabled: {type: boolean, section: host, default: true, guide: whether the host is active in Politia}
