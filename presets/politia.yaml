id: politia
version: 2
default_kind: project

context:
  kind: host
  alias_field: lan_names
  member_field: host
  root_field: politia_root
  state_root_field: state_root

field_sets:
  entity:
    - category
    - host
    - path
    - repo
    - upstream_repo
    - git
    - summary
    - read_first
    - important
    - avoid
    - related
    - use_skills
  project_details:
    - config_format
    - config_path
    - configuration
    - hosts_visibility
    - installed_service_unit
    - interface
    - kernel_registry
    - minimum_codex_version
    - platform_support
    - product_interface
    - public_release_version
    - public_root_commit
    - renderer_status
    - repo_visibility
    - routing_model
    - runtime_state_path
    - service_unit
    - studio_ingress_host
    - studio_state_path
    - studio_ui
    - studio_upstream
    - studio_url
    - sync_mode
    - telegram_languages
    - telegram_mode
  service_details:
    - secret_env_file
  host:
    - role
    - description
    - availability
    - lan_ipv4
    - lan_names
    - politia_user
    - politia_root
    - state_root
    - ssh_target
    - capabilities
    - git_identities
    - git_enforcement
    - politia_geometry
    - enabled
    - avoid

kinds:
  project:
    label: project
    field_sets: [entity, project_details]
  service:
    label: service
    field_sets: [entity, service_details]
  external:
    label: external
    field_sets: [entity]
  lab:
    label: lab
    field_sets: [entity]
  dotmd:
    label: dotmd
    field_sets: [entity]
  skill:
    label: skill
    field_sets: [entity]
  host:
    label: host
    field_sets: [host]

fields:
  category:
    type: string
    section: identity
    guide: grouping inside the entity kind without repeating the top-level kind directory
  host:
    type: ref
    target_kind: host
    section: location
    guide: main host entity that owns this entity
  path:
    type: string
    section: location
    guide: verified absolute path to the project, service, or document
  repo:
    type: string
    section: repository
    guide: primary git repository regardless of visibility or host
  upstream_repo:
    type: string
    section: repository
    guide: upstream repository for forks or derivatives
  git:
    type: record
    section: repository
    guide: applicable Git identity and GitHub CLI context
    fields:
      user_name: { type: string }
      user_email: { type: string }
      gh_cli_user: { type: string }
      instructions: { type: string }
    paired_fields:
      - [user_name, user_email]
  summary:
    type: text
    section: summary
    guide: short verified description
  read_first:
    type: string-list
    section: read_first
    guide: files or documents to read first
  important:
    type: string-list
    section: important
    guide: facts that must affect the work
  avoid:
    type: string-list
    section: avoid
    guide: things an agent must not do or assume
  related:
    type: record-list
    section: related
    guide: related paths, entities, or resources with short notes
    fields:
      path: { type: string, required: true }
      note: { type: text }
  use_skills:
    type: record-list
    section: use_skills
    guide: skills or procedures useful for working with this entity
    fields:
      id: { type: string, required: true }
      note: { type: text }

  role: { type: string, section: host }
  description: { type: text, section: host }
  availability: { type: string, section: host }
  lan_ipv4: { type: string, section: host }
  lan_names: { type: string-list, section: host }
  politia_user: { type: string, section: host }
  politia_root: { type: string, section: host }
  state_root: { type: string, section: host }
  ssh_target: { type: string, section: host }
  capabilities: { type: string-list, section: host }
  git_identities:
    type: record-list
    section: host
    fields:
      user_name: { type: string, required: true }
      user_email: { type: string, required: true }
      gh_cli_user: { type: string }
      instructions: { type: text }
  git_enforcement:
    type: record
    section: host
    fields:
      guard_profile: { type: string }
      hooks_path: { type: string }
  politia_geometry: { type: string-list, section: host }
  enabled: { type: boolean, section: host, default: true }

  config_format: { type: string, section: details, packet: false, draft_optional: false }
  config_path: { type: string, section: details, packet: false, draft_optional: false }
  configuration: { type: string, section: details, packet: false, draft_optional: false }
  hosts_visibility: { type: string, section: details, packet: false, draft_optional: false }
  installed_service_unit: { type: string, section: details, packet: false, draft_optional: false }
  interface: { type: string, section: details, packet: false, draft_optional: false }
  kernel_registry: { type: string, section: details, packet: false, draft_optional: false }
  minimum_codex_version: { type: string, section: details, packet: false, draft_optional: false }
  platform_support: { type: string, section: details, packet: false, draft_optional: false }
  product_interface: { type: string, section: details, packet: false, draft_optional: false }
  public_release_version: { type: string, section: details, packet: false, draft_optional: false }
  public_root_commit: { type: string, section: details, packet: false, draft_optional: false }
  renderer_status: { type: string, section: details, packet: false, draft_optional: false }
  repo_visibility: { type: string, section: details, packet: false, draft_optional: false }
  routing_model: { type: string, section: details, packet: false, draft_optional: false }
  runtime_state_path: { type: string, section: details, packet: false, draft_optional: false }
  service_unit: { type: string, section: details, packet: false, draft_optional: false }
  studio_ingress_host: { type: string, section: details, packet: false, draft_optional: false }
  studio_state_path: { type: string, section: details, packet: false, draft_optional: false }
  studio_ui: { type: string, section: details, packet: false, draft_optional: false }
  studio_upstream: { type: string, section: details, packet: false, draft_optional: false }
  studio_url: { type: string, section: details, packet: false, draft_optional: false }
  sync_mode: { type: string, section: details, packet: false, draft_optional: false }
  telegram_languages: { type: string, section: details, packet: false, draft_optional: false }
  telegram_mode: { type: string, section: details, packet: false, draft_optional: false }
  secret_env_file: { type: string, section: details, packet: false, draft_optional: false }
