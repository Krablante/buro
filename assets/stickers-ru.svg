<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-labelledby="title desc">
  <title id="title">Стикеры BURO</title>
  <desc id="desc">Без RAG, скучный SQLite, сначала diff и только потом штамп.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .heavy { font: 800 24px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.5px; }
      .small { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }
    </style>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-7 104 84)">
    <circle cx="104" cy="84" r="65" fill="#f4efe6" stroke="#b0303e" stroke-width="5"/>
    <circle cx="104" cy="84" r="56" fill="none" stroke="#11151d" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="104" y="80" class="heavy" fill="#11151d" text-anchor="middle">БЕЗ RAG</text>
    <text x="104" y="103" class="small" fill="#b0303e" text-anchor="middle">БЕЗ ГАДАНИЙ</text>
    <path d="M61 58l6 2 2 6 2-6 6-2-6-2-2-6-2 6zm71 52l5 2 2 5 2-5 5-2-5-2-2-5-2 5z" fill="#b0303e"/>
  </g>

  <g filter="url(#shadow)" transform="rotate(2 382 85)">
    <rect x="225" y="23" width="314" height="124" rx="20" fill="#11151d" stroke="#f4efe6" stroke-width="5"/>
    <rect x="234" y="32" width="296" height="106" rx="14" fill="none" stroke="#b0303e" stroke-width="2"/>
    <path d="M264 60c0-8 13-14 29-14s29 6 29 14v44c0 8-13 14-29 14s-29-6-29-14zm0 0c0 8 13 14 29 14s29-6 29-14m-58 22c0 8 13 14 29 14s29-6 29-14" fill="none" stroke="#b0303e" stroke-width="4"/>
    <text x="345" y="78" class="heavy" fill="#f4efe6">СКУЧНЫЙ</text>
    <text x="345" y="105" class="heavy" fill="#f4efe6">SQLITE</text>
    <text x="345" y="126" class="small" fill="#b0303e">ТАК И НАДО</text>
  </g>

  <g filter="url(#shadow)" transform="rotate(-4 649 84)">
    <path d="M566 29l171-10 14 107-174 24-28-52 13-22z" fill="#b0303e" stroke="#f4efe6" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="572" cy="83" r="6" fill="#f4efe6"/>
    <text x="658" y="76" style="font:800 19px Inter,ui-sans-serif,system-ui,sans-serif" fill="#fff" text-anchor="middle">СНАЧАЛА DIFF</text>
    <text x="658" y="101" class="small" fill="#f4efe6" text-anchor="middle">ПОТОМ ШТАМП</text>
  </g>
